name: PR Preview

# Publishes every open PR to its own subpath on the live Pages site
# (.../pr-<number>/), alongside the main deploy, so a change can be tried on
# a phone before merging without waiting for GitHub Pages to redeploy main.
# See .github/workflows/pages.yml (main deploy) and pr-preview-cleanup.yml
# (removes the subpath once the PR closes).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://moamoamorte.github.io/x-76/pr-${context.issue.number}/`;
            const marker = '<!-- pr-preview-link -->';
            const body = `${marker}\n🔗 **Preview:** ${url}\n\n(updates automatically on every push to this PR)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
